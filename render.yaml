services:
  - type: web
    name: rheo
    runtime: node
    plan: free
    branch: v0.3.1-evaluation-ui-repair
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    domains:
      - rheocracy.org
    envVars:
      - key: RHEO_MODEL_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
      - key: OPENAI_API_KEY
        sync: false
