name: Rheo mobile local-context checks

on:
  push:
    branches:
      - mobile-rheo-geolocated-context
      - mobile-rheo-alpha-v0.2
      - 'codex/rheo-v0.10-*'
    paths:
      - 'mobile/**'
      - 'experiments/rheo-v0.10/**'
      - 'package*.json'
      - 'docs/MOBILE_LOCAL_CONTEXT_ARCHITECTURE.md'
      - '.github/workflows/ci-mobile-local-context.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'experiments/rheo-v0.10/**'
      - 'package*.json'
      - 'docs/MOBILE_LOCAL_CONTEXT_ARCHITECTURE.md'
  workflow_dispatch:

jobs:
  local-context-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Install experimental server dependencies
        run: npm ci --no-audit --no-fund
      - name: Experimental and unchanged v0.9 contracts
        run: npm run smoke:experimental && npm run smoke:v0.9
      - name: Mobile fixture and session smokes
        working-directory: mobile
        run: npm run smoke:local
      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck
