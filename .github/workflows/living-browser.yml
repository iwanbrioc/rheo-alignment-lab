name: Living Map browser QA

on:
  push:
    branches:
      - feature/rheo-v0.4-living-map-sandbox
  workflow_dispatch:

jobs:
  living-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright browser for UI smoke
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8080 > /tmp/rheo-server.log 2>&1 &
          sleep 2
      - name: Run living-map desktop and mobile smoke
        run: node scripts/test_living_browser.cjs
