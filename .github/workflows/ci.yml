name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check server.mjs
          node --check server_v0_4.mjs
          node --check realtime.mjs
          node --check app/app.js
          node --check app/app-core.js
          node --check app/flow-ui.js
          node --check app/app-analysis.js
          node --check app/app-report.js
          node --check app/model.js
          node --check app/voice.js
          node --check app/sw.js
          node --check evaluation/smoke_v0_3.mjs
          node --check evaluation/flow-v0.4/smoke_v0_4.mjs
          node --check evaluation/historical-corpus-v1.1/run_corpus.mjs
          node --check evaluation/historical-corpus-v1.2/screen_recognition.mjs
          node --check evaluation/historical-corpus-v2/run_unseen_case.mjs
      - name: Check Python syntax
        run: |
          python -m py_compile evaluation/harness.py
          python -m py_compile evaluation/prompt_budget.py
          python -m py_compile evaluation/historical-corpus-v1.1/make_rating_sheet.py
          python -m py_compile evaluation/historical-corpus-v1.1/validate_corpus.py
          python -m py_compile evaluation/historical-corpus-v1.2/validate_candidates.py
          python -m py_compile evaluation/historical-corpus-v2/validate_private_case.py
          python -m py_compile evaluation/historical-corpus-v2/freeze_case.py
      - name: Parse JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').rglob('*.json'):
              json.loads(p.read_text())
              print('ok', p)
          PY
      - name: Check required research files
        run: |
          test -f prompts/rheo-system-prompt.md
          test -f prompts/sham-control-prompt.md
          test -f prompts/rheo-v0.3-system-prompt.md
          test -f prompts/control-v0.3-system-prompt.md
          test -f prompts/rheo-v0.4-flow-system-prompt.md
          test -f schemas/structural-map-v0.3.schema.json
          test -f schemas/rheo-flow-v0.4.schema.json
          test -f research/EVALUATION_PROTOCOL.md
          test -f research/FROZEN_CLAIMS.md
          test -f research/MECHANISM_CHANGE_PROTOCOL.md
          test -f research/SCORING_RUBRIC.md
          test -f research/SCORING_RUBRIC_V0_3_NEUTRAL.md
          test -f research/RED_TEAM_TESTS.md
          test -f research/CHANGE_RECORD_V0_3_EXECUTABLE_MECHANISM.md
          test -f research/CHANGE_RECORD_V0_3_1_EVALUATION_UI_REPAIR.md
          test -f research/CHANGE_RECORD_V0_3_1_REALTIME_VOICE.md
          test -f research/CHANGE_RECORD_HISTORICAL_CORPUS_V1_1.md
          test -f research/CHANGE_RECORD_HISTORICAL_CORPUS_V1_2_OBSCURE_SCREEN.md
          test -f research/CHANGE_RECORD_HISTORICAL_CORPUS_V2_UNSEEN.md
          test -f research/CHANGE_RECORD_V0_4_FLOW_PHYSIOLOGY.md
          test -f research/INDEPENDENT_CONTROL_SPEC_V0_3_1.md
          test -f research/VOICE_INTERFACE_NOTE_V0_3_1.md
          test -f evaluation/historical-corpus-v1.2/CANDIDATES.json
          test -f evaluation/historical-corpus-v1.2/SOURCES.md
          test -f evaluation/historical-corpus-v2/PROTOCOL.md
          test -f evaluation/historical-corpus-v2/ELIGIBILITY_CHECKLIST.md
          test -f evaluation/historical-corpus-v2/CONTRIBUTOR_GUIDE.md
          test -f evaluation/historical-corpus-v2/templates/T0.template.json
          test -f evaluation/historical-corpus-v2/templates/T1.template.json
          test -f evaluation/historical-corpus-v2/templates/T2.template.json
          test -f evaluation/historical-corpus-v2/templates/consent.template.json
      - name: Validate historical corpus v1.1
        run: python evaluation/historical-corpus-v1.1/validate_corpus.py
      - name: Validate historical corpus v1.2 candidates
        run: python evaluation/historical-corpus-v1.2/validate_candidates.py
      - name: Check Rheo/control prompt budget parity
        run: python evaluation/prompt_budget.py
      - name: Run evaluator self-test
        run: python evaluation/harness.py self-test
      - name: Run example lexical-overlap screen
        run: python evaluation/harness.py screen-pairs evaluation/example-manifest.json
      - name: Run v0.3.1 fixture pipeline smoke test
        run: node evaluation/smoke_v0_3.mjs
      - name: Run v0.4 flow fixture smoke test
        run: node evaluation/flow-v0.4/smoke_v0_4.mjs
