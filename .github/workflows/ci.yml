name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check browser JavaScript syntax
        run: |
          node --check app/app.js
          node --check app/app-core.js
          node --check app/app-analysis.js
          node --check app/app-report.js
          node --check app/sw.js
      - name: Check evaluation harness
        run: python -m py_compile evaluation/harness.py
      - name: Parse JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').rglob('*.json'):
              json.loads(p.read_text())
              print('ok', p)
          PY
      - name: Check required research files
        run: |
          test -f prompts/rheo-system-prompt.md
          test -f prompts/sham-control-prompt.md
          test -f research/EVALUATION_PROTOCOL.md
          test -f research/FROZEN_CLAIMS.md
          test -f research/MECHANISM_CHANGE_PROTOCOL.md
          test -f research/SCORING_RUBRIC.md
          test -f research/RED_TEAM_TESTS.md
      - name: Run example structural screen
        run: python evaluation/harness.py screen-pairs evaluation/example-manifest.json
